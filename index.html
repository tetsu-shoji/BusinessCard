<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>名刺AR動画再生アプリ 90x55 ブレ補正＆棒人間ランナー版</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // ========= 透明なマスク板を作るコンポーネント =========
    AFRAME.registerComponent('depth-mask', {
      init: function () {
        const applyMask = (mesh) => {
          if (mesh && mesh.material) {
            mesh.material.colorWrite = false;
            mesh.renderOrder = -1;
          }
        };

        applyMask(this.el.getObject3D('mesh'));

        this.el.addEventListener('model-loaded', () => {
          applyMask(this.el.getObject3D('mesh'));
        });
      }
    });

    // ========= 新規追加：名刺の4辺を走る棒人間コンポーネント =========
    AFRAME.registerComponent('business-card-runner', {
      schema: {
        cardWidth: { type: 'number', default: 1.0 },
        cardHeight: { type: 'number', default: 0.611111 },
        margin: { type: 'number', default: 0.065 },
        speed: { type: 'number', default: 0.00033 }
      },

      init: function () {
        this.startTime = null;

        this.armLeft = this.el.querySelector('.runner-arm-left');
        this.armRight = this.el.querySelector('.runner-arm-right');
        this.legLeft = this.el.querySelector('.runner-leg-left');
        this.legRight = this.el.querySelector('.runner-leg-right');

        this.head = this.el.querySelector('.runner-head');
        this.body = this.el.querySelector('.runner-body');
      },

      tick: function (time) {
        if (this.startTime === null) {
          this.startTime = time;
        }

        const elapsed = time - this.startTime;

        const cardWidth = this.data.cardWidth;
        const cardHeight = this.data.cardHeight;
        const margin = this.data.margin;
        const speed = this.data.speed;

        const left = -cardWidth / 2 - margin;
        const right = cardWidth / 2 + margin;
        const top = cardHeight / 2 + margin;
        const bottom = -cardHeight / 2 - margin;

        const widthLength = right - left;
        const heightLength = top - bottom;
        const perimeter = widthLength * 2 + heightLength * 2;

        const distance = (elapsed * speed) % perimeter;

        let x = 0;
        let y = 0;
        let zRotation = 0;

        if (distance < widthLength) {
          // 上辺：左から右へ
          const t = distance / widthLength;
          x = left + widthLength * t;
          y = top;
          zRotation = -90;
        } else if (distance < widthLength + heightLength) {
          // 右辺：上から下へ
          const t = (distance - widthLength) / heightLength;
          x = right;
          y = top - heightLength * t;
          zRotation = 180;
        } else if (distance < widthLength * 2 + heightLength) {
          // 下辺：右から左へ
          const t = (distance - widthLength - heightLength) / widthLength;
          x = right - widthLength * t;
          y = bottom;
          zRotation = 90;
        } else {
          // 左辺：下から上へ
          const t = (distance - widthLength * 2 - heightLength) / heightLength;
          x = left;
          y = bottom + heightLength * t;
          zRotation = 0;
        }

        // 動画より少し手前に表示
        this.el.setAttribute('position', `${x} ${y} 0.10`);
        this.el.setAttribute('rotation', `0 0 ${zRotation}`);

        // 手足を走っているように振る
        const swing = Math.sin(elapsed * 0.018) * 35;

        if (this.armLeft) {
          this.armLeft.setAttribute('rotation', `0 0 ${45 + swing}`);
        }

        if (this.armRight) {
          this.armRight.setAttribute('rotation', `0 0 ${-45 - swing}`);
        }

        if (this.legLeft) {
          this.legLeft.setAttribute('rotation', `0 0 ${-25 - swing}`);
        }

        if (this.legRight) {
          this.legRight.setAttribute('rotation', `0 0 ${25 + swing}`);
        }

        // 少し上下に弾ませる
        const hop = Math.abs(Math.sin(elapsed * 0.018)) * 0.025;
        if (this.body) {
          this.body.setAttribute('position', `0 ${0.18 + hop} 0`);
        }
        if (this.head) {
          this.head.setAttribute('position', `0 ${0.43 + hop} 0`);
        }
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    video:not(#cardVideo) {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      display: block !important;
      background: transparent !important;
    }

    #cardVideo {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      z-index: -1 !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #topPanel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #111;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #startBtn {
      background: #005bd3;
      color: #fff;
    }

    #stopBtn {
      background: #333;
      color: #fff;
    }

    #soundBtn {
      background: #00a36c;
      color: #fff;
    }

    #modeBtn {
      background: #ff9800;
      color: #fff;
    }

    #captureBtn {
      background: #e91e63;
      color: #fff;
    }

    #replayBtn {
      background: #ffffff;
      color: #111;
    }

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 30;
      color: #fff;
      background: rgba(0, 0, 0, 0.74);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      pointer-events: none;
    }

    #targetGuide {
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 78vw;
      max-width: 420px;
      aspect-ratio: 90 / 55;
      z-index: 25;
      border: 3px dashed rgba(255,255,255,0.82);
      border-radius: 12px;
      pointer-events: none;
      display: none;
    }

    #targetGuide::after {
      content: "登録した名刺をこの枠に合わせてください";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -34px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    #foundBanner {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 91, 211, 0.94);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <div id="topPanel">
      <button id="startBtn">カメラ開始</button>
      <button id="stopBtn">停止</button>
      <button id="soundBtn">音ON</button>
      <button id="modeBtn">立体モードへ切替</button>
      <button id="captureBtn">撮影＆保存</button>
      <button id="replayBtn">最初から</button>
    </div>
    <div id="foundBanner">名刺を認識しました</div>
    <div id="targetGuide"></div>
    <div id="status">初期化中です。</div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./business_card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true; preserveDrawingBuffer: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      ./business_card_video.mp4
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="cardTarget" mindar-image-target="targetIndex: 0">

      <!-- 名刺の奥側を隠す透明マスク板 -->
      <a-plane
        position="0 0 -0.01"
        width="3"
        height="3"
        depth-mask>
      </a-plane>

      <!-- 名刺に重ねる動画 -->
      <a-entity id="videoWrapper" position="0 0 0.03" rotation="0 0 0">
        #cardVideo
        </a-video>
      </a-entity>

      <!-- 新規追加：名刺の4辺を走る小さい棒人間 -->
      <a-entity
        id="runner"
        scale="0.055 0.055 0.055"
        business-card-runner="cardWidth: 1; cardHeight: 0.611111; margin: 0.065; speed: 0.00033;">

        <!-- 頭 -->
        <a-sphere
          class="runner-head"
          radius="0.105"
          position="0 0.43 0"
          color="#fff176"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-sphere>

        <!-- 胴体 -->
        <a-cylinder
          class="runner-body"
          radius="0.032"
          height="0.38"
          position="0 0.18 0"
          rotation="0 0 0"
          color="#00e5ff"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-cylinder>

        <!-- 左腕 -->
        <a-cylinder
          class="runner-arm-left"
          radius="0.024"
          height="0.32"
          position="-0.13 0.23 0"
          rotation="0 0 45"
          color="#ffffff"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-cylinder>

        <!-- 右腕 -->
        <a-cylinder
          class="runner-arm-right"
          radius="0.024"
          height="0.32"
          position="0.13 0.23 0"
          rotation="0 0 -45"
          color="#ffffff"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-cylinder>

        <!-- 左脚 -->
        <a-cylinder
          class="runner-leg-left"
          radius="0.027"
          height="0.36"
          position="-0.08 -0.13 0"
          rotation="0 0 -25"
          color="#ffffff"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-cylinder>

        <!-- 右脚 -->
        <a-cylinder
          class="runner-leg-right"
          radius="0.027"
          height="0.36"
          position="0.08 -0.13 0"
          rotation="0 0 25"
          color="#ffffff"
          material="shader: standard; roughness: 0.35; metalness: 0.05;">
        </a-cylinder>

        <!-- 足元の小さい影 -->
        <a-circle
          radius="0.14"
          position="0 -0.34 -0.01"
          rotation="0 0 0"
          color="#000000"
          opacity="0.28"
          material="shader: flat; transparent: true; side: double;">
        </a-circle>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('#arScene');
    const cardTargetEl = document.querySelector('#cardTarget');
    const videoWrapper = document.querySelector('#videoWrapper');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#cardVideo');
    const runnerEl = document.querySelector('#runner');

    const startBtn = document.querySelector('#startBtn');
    const stopBtn = document.querySelector('#stopBtn');
    const soundBtn = document.querySelector('#soundBtn');
    const modeBtn = document.querySelector('#modeBtn');
    const captureBtn = document.querySelector('#captureBtn');
    const replayBtn = document.querySelector('#replayBtn');

    const statusEl = document.querySelector('#status');
    const targetGuide = document.querySelector('#targetGuide');
    const foundBanner = document.querySelector('#foundBanner');

    let sceneLoaded = false;
    let arStarted = false;
    let videoUnlocked = false;
    let isVerticalMode = false;

    window.addEventListener('load', () => {
      statusEl.textContent = '準備完了です。カメラ開始を押してください。';
    });

    sceneEl.addEventListener('loaded', () => {
      sceneLoaded = true;
    });

    // ========= モード切替処理 =========
    modeBtn.addEventListener('click', () => {
      isVerticalMode = !isVerticalMode;

      if (isVerticalMode) {
        modeBtn.textContent = '平面モードへ切替';
        modeBtn.style.background = '#005bd3';

        videoWrapper.setAttribute('position', '0 0.3055 0.03');
        videoWrapper.setAttribute('rotation', '90 0 0');

        // 動画は初期状態でマスク板の裏側へ
        videoPlane.setAttribute('position', '0 -0.35 0');
        statusEl.textContent = '立体モードに切り替えました。';

        // 棒人間は名刺の平面上を走らせたままにする
        runnerEl.setAttribute('visible', 'true');
      } else {
        modeBtn.textContent = '立体モードへ切替';
        modeBtn.style.background = '#ff9800';

        videoWrapper.setAttribute('position', '0 0 0.03');
        videoWrapper.setAttribute('rotation', '0 0 0');
        videoPlane.setAttribute('position', '0 0 0');
        videoPlane.removeAttribute('animation');

        runnerEl.setAttribute('visible', 'true');
        statusEl.textContent = '平面モードに切り替えました。';
      }
    });

    // ========= 撮影・保存処理 =========
    captureBtn.addEventListener('click', () => {
      const arCanvas = document.querySelector('canvas.a-canvas');
      const cameraVideos = Array.from(document.querySelectorAll('video'));
      const cameraVideo = cameraVideos.find(v => v.id !== 'cardVideo');

      if (!arCanvas || !cameraVideo) {
        alert('ARが起動してから撮影してください。');
        return;
      }

      if (sceneEl.renderer && sceneEl.camera) {
        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      }

      const compCanvas = document.createElement('canvas');
      compCanvas.width = arCanvas.width;
      compCanvas.height = arCanvas.height;

      const ctx = compCanvas.getContext('2d');

      const videoRatio = cameraVideo.videoWidth / cameraVideo.videoHeight;
      const canvasRatio = compCanvas.width / compCanvas.height;

      let drawWidth;
      let drawHeight;
      let offsetX;
      let offsetY;

      if (canvasRatio > videoRatio) {
        drawWidth = compCanvas.width;
        drawHeight = compCanvas.width / videoRatio;
        offsetX = 0;
        offsetY = (compCanvas.height - drawHeight) / 2;
      } else {
        drawHeight = compCanvas.height;
        drawWidth = compCanvas.height * videoRatio;
        offsetX = (compCanvas.width - drawWidth) / 2;
        offsetY = 0;
      }

      ctx.drawImage(cameraVideo, offsetX, offsetY, drawWidth, drawHeight);
      ctx.drawImage(arCanvas, 0, 0, compCanvas.width, compCanvas.height);

      const dataURL = compCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      const dateStr = new Date().toISOString().replace(/[:.]/g, '-');

      link.download = `AR_Snap_${dateStr}.png`;
      link.href = dataURL;
      link.click();

      statusEl.textContent = '画像を保存しました！（端末によっては長押し保存が必要です）';
    });

    // ========= MindARシステム待機 =========
    async function waitForMindARSystem() {
      for (let i = 0; i < 50; i++) {
        const system = sceneEl.systems['mindar-image-system'];
        if (system) return system;
        await new Promise(resolve => setTimeout(resolve, 200));
      }
      return null;
    }

    // ========= 動画再生許可を先に取得 =========
    async function unlockVideoOnce() {
      if (videoUnlocked) return;

      try {
        videoEl.muted = true;
        videoEl.playsInline = true;
        await videoEl.play();
        videoEl.pause();
        videoEl.currentTime = 0;
        videoUnlocked = true;
      } catch (e) {
        console.log('video unlock failed', e);
      }
    }

    // ========= カメラとARキャンバスの重なり補正 =========
    function fixCameraVisualLayer() {
      const videos = Array.from(document.querySelectorAll('video'));
      const cameraVideo = videos.find(v => v.id !== 'cardVideo');
      const canvas = document.querySelector('canvas');

      if (cameraVideo) {
        cameraVideo.style.position = 'fixed';
        cameraVideo.style.top = '0';
        cameraVideo.style.left = '0';
        cameraVideo.style.width = '100vw';
        cameraVideo.style.height = '100vh';
        cameraVideo.style.objectFit = 'cover';
        cameraVideo.style.zIndex = '0';
        cameraVideo.style.display = 'block';
      }

      videoEl.style.position = 'absolute';
      videoEl.style.width = '1px';
      videoEl.style.height = '1px';
      videoEl.style.opacity = '0';
      videoEl.style.zIndex = '-1';
      videoEl.style.pointerEvents = 'none';

      if (canvas) {
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        canvas.style.zIndex = '1';
      }
    }

    // ========= カメラ開始 =========
    startBtn.addEventListener('click', async () => {
      try {
        const mindarSystem = await waitForMindARSystem();

        if (!mindarSystem) {
          statusEl.textContent = 'MINDARシステムが見つかりません。ページを再読み込みしてください。';
          return;
        }

        await unlockVideoOnce();

        targetGuide.style.display = 'block';
        foundBanner.style.display = 'none';

        await mindarSystem.start();

        arStarted = true;

        setTimeout(fixCameraVisualLayer, 200);
        setTimeout(fixCameraVisualLayer, 800);
        setTimeout(fixCameraVisualLayer, 1500);

        statusEl.textContent = '登録した名刺を画面中央に入れてください。';
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'カメラ開始に失敗しました。HTTPSで開いているか、カメラ許可が出ているか確認してください。';
      }
    });

    // ========= 停止 =========
    stopBtn.addEventListener('click', () => {
      const system = sceneEl.systems['mindar-image-system'];

      if (system) {
        system.stop();
      }

      arStarted = false;

      videoEl.pause();

      targetGuide.style.display = 'none';
      foundBanner.style.display = 'none';

      statusEl.textContent = '停止しました。';
    });

    // ========= 音ON/OFF =========
    soundBtn.addEventListener('click', async () => {
      videoEl.muted = !videoEl.muted;
      soundBtn.textContent = videoEl.muted ? '音ON' : '音OFF';
      statusEl.textContent = videoEl.muted ? 'ミュートにしました。' : '音をONにしました。';

      try {
        await videoEl.play();
      } catch (e) {
        console.log(e);
      }
    });

    // ========= 最初から再生 =========
    replayBtn.addEventListener('click', async () => {
      videoEl.currentTime = 0;

      try {
        await videoEl.play();
        statusEl.textContent = '最初から再生しました。';
      } catch (e) {
        console.log(e);
      }
    });

    let playAfterAnimHandler = null;

    // ========= 名刺認識時 =========
    cardTargetEl.addEventListener('targetFound', async () => {
      targetGuide.style.display = 'none';
      foundBanner.style.display = 'block';
      foundBanner.textContent = '名刺を認識しました';

      videoEl.currentTime = 0;

      // 棒人間表示
      runnerEl.setAttribute('visible', 'true');

      if (isVerticalMode) {
        statusEl.textContent = '動画が立ち上がります...';

        // マスク板の裏側からスタート
        videoPlane.setAttribute('position', '0 -0.35 0');

        videoPlane.setAttribute('animation', {
          property: 'position',
          to: '0 0.3055 0',
          dur: 1000,
          easing: 'easeOutQuad',
          loop: false
        });

        if (playAfterAnimHandler) {
          videoPlane.removeEventListener('animationcomplete', playAfterAnimHandler);
        }

        playAfterAnimHandler = async () => {
          try {
            await videoEl.play();
            statusEl.textContent = '再生を開始しました。棒人間が名刺の周囲を走っています。';
          } catch (e) {
            console.log(e);
          }
        };

        videoPlane.addEventListener('animationcomplete', playAfterAnimHandler, { once: true });

      } else {
        try {
          await videoEl.play();
          statusEl.textContent = '再生を開始しました。棒人間が名刺の周囲を走っています。';
        } catch (e) {
          console.log(e);
        }
      }

      setTimeout(() => {
        foundBanner.style.display = 'none';
      }, 2500);
    });

    // ========= 名刺を見失った時 =========
    cardTargetEl.addEventListener('targetLost', () => {
      if (!arStarted) return;

      videoEl.pause();

      foundBanner.style.display = 'none';
      targetGuide.style.display = 'block';

      statusEl.textContent = '名刺を見失いました。もう一度枠に入れてください。';

      if (isVerticalMode) {
        videoPlane.removeAttribute('animation');
        videoPlane.setAttribute('position', '0 -0.35 0');
      }
    });
  </script>
</body>
</html>
