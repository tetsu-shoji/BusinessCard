<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>名刺AR画像表示アプリ</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      display: block !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #topPanel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #111;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    button:active { transform: scale(0.97); }
    #startBtn { background: #005bd3; color: #fff; }
    #stopBtn { background: #333; color: #fff; }

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 30;
      color: #fff;
      background: rgba(0, 0, 0, 0.74);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      pointer-events: none;
    }

    #targetGuide {
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 78vw;
      max-width: 420px;
      aspect-ratio: 91 / 55;
      z-index: 25;
      border: 3px dashed rgba(255,255,255,0.82);
      border-radius: 12px;
      pointer-events: none;
      display: none;
    }

    #targetGuide::after {
      content: "登録した名刺をこの枠に合わせてください";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -34px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    #foundBanner {
      position: fixed;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 91, 211, 0.94);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <div id="topPanel">
      <button id="startBtn">カメラ開始</button>
      <button id="stopBtn">停止</button>
      <button id="checkBtn">確認</button>
    </div>
    <div id="foundBanner">名刺を認識しました</div>
    <div id="targetGuide"></div>
    <div id="status">初期化中です。</div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./business_card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true; preserveDrawingBuffer: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="overlayImage" src="./business_card_overlay.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="cardTarget" mindar-image-target="targetIndex: 0">
      <!-- 日本の標準的な名刺 91mm x 55mm の比率。width=1 / height=55/91=0.604 -->
      <a-image
        id="overlayPlane"
        src="#overlayImage"
        width="1"
        height="0.604"
        position="0 0 0.02"
        rotation="0 0 0"
        material="shader: flat; side: double; transparent: true;">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('#arScene');
    const cardTargetEl = document.querySelector('#cardTarget');
    const startBtn = document.querySelector('#startBtn');
    const stopBtn = document.querySelector('#stopBtn');
    const checkBtn = document.querySelector('#checkBtn');
    const statusEl = document.querySelector('#status');
    const targetGuide = document.querySelector('#targetGuide');
    const foundBanner = document.querySelector('#foundBanner');

    let sceneLoaded = false;
    let arStarted = false;

    window.addEventListener('load', () => {
      statusEl.textContent = 'ページを読み込みました。ARシーンの初期化を待っています。';
    });

    sceneEl.addEventListener('loaded', () => {
      sceneLoaded = true;
      statusEl.textContent = '準備完了です。確認ボタンでファイル状態を確認できます。';
    });

    async function waitForMindARSystem() {
      for (let i = 0; i < 50; i++) {
        const system = sceneEl.systems['mindar-image-system'];
        if (system) return system;
        await new Promise(resolve => setTimeout(resolve, 200));
      }
      return null;
    }

    function fixCameraVisualLayer() {
      const cameraVideo = Array.from(document.querySelectorAll('video')).find(v => !v.id);
      const canvas = document.querySelector('canvas');
      if (cameraVideo) {
        cameraVideo.style.position = 'fixed';
        cameraVideo.style.top = '0';
        cameraVideo.style.left = '0';
        cameraVideo.style.width = '100vw';
        cameraVideo.style.height = '100vh';
        cameraVideo.style.objectFit = 'cover';
        cameraVideo.style.zIndex = '0';
        cameraVideo.style.opacity = '1';
        cameraVideo.style.display = 'block';
      }
      if (canvas) {
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        canvas.style.zIndex = '1';
        canvas.style.background = 'transparent';
      }
    }

    async function checkFilesAndSystem() {
      let message = '';
      message += 'URL:\n' + location.href + '\n\n';
      message += 'HTTPS / Secure Context:\n' + (window.isSecureContext ? 'OK' : 'NG') + '\n\n';
      message += 'カメラAPI:\n' + ((navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? 'OK' : 'NG') + '\n\n';
      message += 'AFRAME:\n' + (window.AFRAME ? 'OK' : 'NG') + '\n\n';
      message += 'MindARコンポーネント登録:\n' + ((window.AFRAME && AFRAME.components && AFRAME.components['mindar-image-target']) ? 'OK: mindar-image-target あり' : 'NG: mindar-image-target なし') + '\n\n';
      message += 'ファイル確認:\n';
      for (const file of ['./business_card.mind', './business_card_overlay.png']) {
        try {
          const res = await fetch(file, { cache: 'no-store' });
          message += file + ' : HTTP ' + res.status + '\n';
        } catch (e) {
          message += file + ' : fetch失敗\n';
        }
      }
      const system = sceneEl.systems['mindar-image-system'];
      message += '\nMindARシステム:\n' + (system ? 'OK: 見つかりました' : 'NG: 見つかりません');
      statusEl.textContent = message;
    }

    checkBtn.addEventListener('click', checkFilesAndSystem);

    startBtn.addEventListener('click', async () => {
      try {
        if (!window.isSecureContext) {
          statusEl.textContent = 'HTTPSではありません。GitHub Pagesの https:// URLで開いてください。';
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusEl.textContent = 'このブラウザではカメラAPIが使えません。Android Chrome または Safari で試してください。';
          return;
        }
        if (!sceneLoaded) {
          statusEl.textContent = 'ARシーンの読み込みがまだ完了していません。少し待つか、確認ボタンを押してください。';
          return;
        }
        const mindarSystem = await waitForMindARSystem();
        if (!mindarSystem) {
          statusEl.textContent = 'MindARシステムが見つかりません。scriptタグ、CDN、GitHub Pages URLを確認してください。';
          return;
        }
        targetGuide.style.display = 'block';
        statusEl.textContent = 'カメラを起動しています。登録した名刺を枠に合わせてください。';
        await mindarSystem.start();
        arStarted = true;
        setTimeout(fixCameraVisualLayer, 500);
        statusEl.textContent = '探索中です。business_card.mind に登録した名刺を画面中央に入れてください。';
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'カメラ開始に失敗しました。\n' + (error.message || String(error));
      }
    });

    stopBtn.addEventListener('click', () => {
      const system = sceneEl.systems['mindar-image-system'];
      if (system) system.stop();
      arStarted = false;
      targetGuide.style.display = 'none';
      foundBanner.style.display = 'none';
      statusEl.textContent = '停止しました。';
    });

    cardTargetEl.addEventListener('targetFound', () => {
      targetGuide.style.display = 'none';
      foundBanner.style.display = 'block';
      statusEl.textContent = '名刺に合わせて添付画像を表示しています。';
      setTimeout(() => { foundBanner.style.display = 'none'; }, 2500);
    });

    cardTargetEl.addEventListener('targetLost', () => {
      if (!arStarted) return;
      foundBanner.style.display = 'none';
      targetGuide.style.display = 'block';
      statusEl.textContent = '名刺を見失いました。もう一度、名刺を画面中央に入れてください。';
    });
  </script>
</body>
</html>
